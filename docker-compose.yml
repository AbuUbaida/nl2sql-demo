services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nl2sql_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_owner -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: